
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour 360° Đền Hùng</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .tour {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #000;
    }
  </style>
</head>

<body>
  <iframe
    class="tour"
    src="./tour/index.htm"
    title="Tour tham quan 360 độ Đền Hùng"
    allow="fullscreen; accelerometer; gyroscope; vr; xr"
    allowfullscreen>
  </iframe>
</body>
</html>
