
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tour tham quan Đền Hùng</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f1e8;
      color: #29251f;
    }

    header {
      background: #762b20;
      color: white;
      text-align: center;
      padding: 30px 16px;
    }

    main {
      max-width: 1100px;
      margin: 30px auto;
      padding: 0 16px;
    }

    .tour {
      width: 100%;
      height: 70vh;
      min-height: 420px;
      border: 0;
      border-radius: 12px;
      background: #ddd;
    }

    .note {
      line-height: 1.7;
      text-align: center;
    }

    footer {
      padding: 20px;
      text-align: center;
      background: #762b20;
      color: white;
    }
  </style>
</head>
<body>
  <header>
    <h1>KHÁM PHÁ ĐỀN HÙNG</h1>
    <p>Tour tham quan ảo 360°</p>
  </header>

  <main>
    <h2>Trải nghiệm không gian di tích</h2>

    <iframe
      class="tour"
      src="./tour/index.htm"
      title="Tour 360 độ Đền Hùng"
      allow="fullscreen; accelerometer; gyroscope; vr; xr"
      allowfullscreen>
    </iframe>

    <p class="note">
      Khám phá các địa điểm tiêu biểu trong Khu di tích
      lịch sử Đền Hùng thông qua tour tham quan ảo.
    </p>
  </main>

  <footer>
    Tour tham quan ảo Đền Hùng
  </footer>
</body>
</html>
