
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tour 360° Đền Hùng</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .tour {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      border: none;
      display: block;
      background: #000;
    }

    #musicButton {
      position: fixed;
      right: 20px;
      bottom: 20px;
      z-index: 9999;
      padding: 12px 18px;
      border: 1px solid rgba(255,255,255,0.4);
      border-radius: 30px;
      background: rgba(20,20,20,0.75);
      color: white;
      font-size: 14px;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    #musicButton:hover {
      background: rgba(90,65,30,0.9);
    }
  </style>
</head>

<body>

  <!-- Tour 360 độ -->
  <iframe
    class="tour"
    src="./tour/index.htm"
    title="Tour tham quan 360 độ Đền Hùng"
    allow="fullscreen; accelerometer; gyroscope; vr; xr"
    allowfullscreen>
  </iframe>

  <!-- Nhạc nền -->
  <audio id="backgroundMusic" loop preload="auto">
    <source src="./music/nhac-nen.mp3" type="audio/mpeg">
  </audio>

  <!-- Nút điều khiển nhạc -->
  <button id="musicButton" type="button">
    ♫ Bật nhạc nền
  </button>

  <script>
    const music = document.getElementById("backgroundMusic");
    const button = document.getElementById("musicButton");

    music.volume = 0.25;

    button.addEventListener("click", async () => {
      if (music.paused) {
        try {
          await music.play();
          button.textContent = "♫ Tắt nhạc nền";
        } catch (error) {
          button.textContent = "Không phát được nhạc";
        }
      } else {
        music.pause();
        button.textContent = "♫ Bật nhạc nền";
      }
    });

    music.addEventListener("ended", () => {
      button.textContent = "♫ Bật nhạc nền";
    });
  </script>

</body>
</html>
